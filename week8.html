
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Grid Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="dashboard">

    <header class="header">
      <h2>📊 My Dashboard</h2>
      <div class="profile">Welcome, User 👋</div>
    </header>

    <aside class="sidebar">
      <h3>Menu</h3>
      <a href="#">🏠 Home</a>
      <a href="#">📈 Reports</a>
      <a href="#">👥 Users</a>
      <a href="#">⚙️ Settings</a>
    </aside>

    <main class="main">
      <h1>Dashboard Overview</h1>
      <p>Here is your activity summary.</p>

      <div class="cards">

        <div class="card">
          <span class="icon">👥</span>
          <div>
            <h3>Total Users</h3>
            <p>1,240</p>
          </div>
        </div>

        <div class="card">
          <span class="icon">💰</span>
          <div>
            <h3>Revenue</h3>
            <p>₹24,500</p>
          </div>
        </div>

        <div class="card">
          <span class="icon">🛒</span>
          <div>
            <h3>Orders</h3>
            <p>320</p>
          </div>
        </div>

        <div class="card">
          <span class="icon">📈</span>
          <div>
            <h3>Growth</h3>
            <p>12.5%</p>
          </div>
        </div>

        <div class="card">
          <span class="icon">📦</span>
          <div>
            <h3>Products</h3>
            <p>85</p>
          </div>
        </div>

        <div class="card">
          <span class="icon">⭐</span>
          <div>
            <h3>Rating</h3>
            <p>4.8 / 5</p>
          </div>
        </div>

      </div>
    </main>

    <footer class="footer">
      <p>© 2026 My Dashboard | Built with CSS Grid</p>
    </footer>

  </div>

</body>
</html>
